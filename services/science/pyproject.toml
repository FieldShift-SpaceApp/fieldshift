[project]
name = "fieldshift"
version = "0.1.0"
description = "FieldShift science pipeline: NASA data ingestion, harmonization and indices (offline CLI)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic==2.14.3",
]

[project.scripts]
fieldshift = "fieldshift.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
