# SI-assisted: Claude Code (Anthropic); review: pending (see SI-USAGE.md)
# Winter 2023 replay for Cruz Alta and the Planalto Médio (RS). Read by `fieldshift complements`.
# Only measured facts, each with its primary source; no claim about what anyone decided or why.
# Every number below was checked against its primary source by the team's independent
# verification of 14/11/2026, except the money figures of `winter-paths-2023` (team analysis,
# flagged in its limitations). The wheat failure counts are not written here: the pipeline
# computes them from the IBGE PAM files in input/ibge-wheat/ (event `wheat-failures`).
id: winter-2023
title: "Winter 2023 at Cruz Alta: the ENSO alert, the sowing window, credit and the wheat result"
period: { start: "2023-01-01", end: "2023-12-31" }
events:
  - id: el-nino-watch
    kind: forecast
    date: "2023-04-13"
    title: "NOAA CPC issues an El Niño Watch"
    detail: >-
      The ENSO Diagnostic Discussion of 13 April 2023 changed the status to "El Niño Watch":
      ENSO-neutral expected through spring, followed by a 62% chance of El Niño developing during
      May-July 2023. The previous discussion (9 March 2023) had been the "Final La Niña Advisory".
    values:
      - { id: p_el_nino_mjj, label: "Chance of El Niño developing in May-July 2023", value: 0.62, unit: probability }
    source:
      authored_by: "NOAA Climate Prediction Center, ENSO Diagnostic Discussion (status and synopsis transcribed)"
      attribution: [{ group: other_public, name: "NOAA CPC ENSO Diagnostic Discussion" }]
      refs:
        - { label: "NOAA CPC, ENSO Diagnostic Discussion, 13 April 2023", url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_disc_apr2023/ensodisc.shtml" }
        - { label: "NOAA CPC, ENSO Diagnostic Discussion, 9 March 2023", url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_disc_mar2023/ensodisc.shtml" }
      limitations:
        - "The Watch speaks of May-July in the Northern Hemisphere calendar; it is not a forecast for the wheat season itself."

  - id: zarc-wheat-window
    kind: planting_window
    period: { start: "2023-06-01", end: "2023-07-20" }
    title: "ZARC sowing window for rainfed wheat at Cruz Alta (20% risk class)"
    detail: >-
      In the ZARC risk table 2022/2023 (MAPA Portaria 385 of 8 December 2022), rainfed wheat at
      Cruz Alta has its lowest risk class (20%) from 1 June to 20 July for cycle group 22
      (ten-day periods 16 to 20), from 11 June for group 21 and from 21 June for group 20, all
      ending on 20 July; the 30% class opens on 21 May. The same window holds for the three soil
      types of that table.
    values:
      - { id: dekads_20pct_risk, label: "Ten-day periods in the 20% risk class (cycle group 22)", value: 5, unit: count }
    source:
      authored_by: "MAPA, ZARC risk table (Tábua de risco) 2022/2023, rows of municipality 4306106 transcribed"
      attribution: [{ group: other_public, name: "MAPA (Brazil), ZARC agricultural risk zoning" }]
      refs:
        - { label: "MAPA, Tábua de risco - Safra 2022/2023 (open data portal, CC BY)", url: "https://dados.agricultura.gov.br/dataset/6d3d141c-885e-41a4-ab7f-dc8ff323b96f/resource/9201690c-ec14-4607-9f37-f6ee5b10168f/download/dados-abertos-tabua-de-risco-safra-2022-2023.csv" }
      limitations:
        - "Assumed to be the table in force for the 2023 winter sowing, because it was published on 8 December 2022; the next wheat table came out on 28 December 2023."
        - "Read from the team's filtered copy of the MAPA file (all Cruz Alta rows, downloaded 14/11/2026 16:26 BRT); the portal did not answer a second download at 20:10 BRT the same day."
        - "ZARC gives the sowing date and its risk class only; it does not say when the crop is harvested."

  - id: el-nino-advisory
    kind: forecast
    date: "2023-06-08"
    title: "NOAA CPC issues an El Niño Advisory"
    detail: >-
      The ENSO Diagnostic Discussion of 8 June 2023 changed the status to "El Niño Advisory": El
      Niño conditions are present and expected to gradually strengthen into the Northern
      Hemisphere winter 2023-24.
    values: []
    source:
      authored_by: "NOAA Climate Prediction Center, ENSO Diagnostic Discussion (status and synopsis transcribed)"
      attribution: [{ group: other_public, name: "NOAA CPC ENSO Diagnostic Discussion" }]
      refs:
        - { label: "NOAA CPC, ENSO Diagnostic Discussion, 8 June 2023", url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_disc_jun2023/ensodisc.shtml" }
      limitations:
        - "The Advisory came after the start of the ZARC sowing window for wheat."

  - id: wheat-credit
    kind: credit
    period: { start: "2023-01-01", end: "2023-12-31" }
    title: "Wheat operating credit in the 18 Planalto Médio municipalities stayed level"
    detail: >-
      Operating (custeio) credit for wheat registered in the Central Bank SICOR system, summed by
      calendar year of issue over 18 municipalities of the Planalto Médio: the 2023 value was 3.1%
      below 2022 in constant reais (December 2025, IPCA), and the financed area of January-October
      was 2.3% above January-October 2022 (155,964 against 152,465 ha). The annual financed area
      was 0.5% lower.
    values:
      - { id: credit_value_real_change_pct, label: "Credit value 2023 vs 2022, constant reais", value: -3.1, unit: "%" }
      - { id: financed_area_jan_oct_change_pct, label: "Financed area Jan-Oct 2023 vs Jan-Oct 2022", value: 2.3, unit: "%" }
    source:
      authored_by: "Banco Central do Brasil, SICOR open data (CusteioMunicipioProduto), recomputed by the team's independent verification of 14/11/2026"
      attribution: [{ group: other_public, name: "Banco Central do Brasil, SICOR rural credit" }]
      refs:
        - { label: "BCB SICOR OData service, CusteioMunicipioProduto (ODbL)", url: "https://olinda.bcb.gov.br/olinda/servico/SICOR/versao/v2/odata/CusteioMunicipioProduto" }
        - { label: "BCB SGS series 433 (IPCA), used to deflate to December 2025", url: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados?formato=json" }
      limitations:
        - "Coverage: only credit registered in SICOR for the product 'TRIGO' in 18 municipalities; wheat planted with own money or other credit is not here."
        - "Period: value by calendar year of issue; the area comparison uses January-October of both years. Credit for a winter crop is mostly contracted before sowing, so it shows the plan, not the result."

  - id: wheat-failures
    kind: yield
    period: { start: "2023-01-01", end: "2023-12-31" }
    computed: wheat_failures

  - id: winter-paths-2023
    kind: outcome
    period: { start: "2023-01-01", end: "2023-12-31" }
    title: "Money per hectare in winter 2023 at Cruz Alta: wheat margin and cover-crop cost"
    detail: >-
      Wheat: IBGE PAM revenue per planted hectare (1,500 kg/ha at the implicit 2023 price) minus
      the CONAB production cost for Cruz Alta (March 2023 sheet), in December 2025 reais. Against
      the operating cost the margin was -3,829 R$/ha; against the variable cost only, -3,268 R$/ha.
      Cover crop (black oat, no harvest, no revenue): 332 R$/ha of seed and sowing, from the only
      official cost found (Embrapa Trigo, 2007 prices updated by IPCA). Fallow has no sourced cost
      and is not given a value.
    values:
      - { id: wheat_margin_operating_cost, label: "Wheat margin over CONAB operating cost (without land rent)", value: -3829, unit: "BRL/ha" }
      - { id: wheat_margin_variable_cost, label: "Wheat margin over CONAB variable cost", value: -3268, unit: "BRL/ha" }
      - { id: cover_crop_cost, label: "Black oat cover crop cost (seed and sowing; no revenue)", value: 332, unit: "BRL/ha" }
    source:
      authored_by: "FieldShift team analysis 'money per winter' (14/11/2026) from IBGE, CONAB, IPCA and Embrapa; values transcribed"
      attribution:
        - { group: other_public, name: "IBGE Produção Agrícola Municipal (SIDRA 1612)" }
        - { group: other_public, name: "CONAB production cost series" }
        - { group: other_public, name: "Embrapa Trigo, Comunicado Técnico 207" }
      refs:
        - { label: "IBGE SIDRA 1612, wheat (2716), area, production and value", url: "https://apisidra.ibge.gov.br/values/t/1612/n6/4306106/v/109,216,112,215/p/all/c81/2716" }
        - { label: "CONAB, wheat production cost series 1998-2025 (spreadsheet)", url: "https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/custos-de-producao/arquivos-custo-de-producao/agricolas/" }
        - { label: "IBGE SIDRA 1737, IPCA index (deflator, December 2025 base)", url: "https://apisidra.ibge.gov.br/values/t/1737/n1/all/v/2266/p/all" }
        - { label: "De Mori, C. (2007). Estimativas de custo de produção de trigo e de aveia: safra 2007. Embrapa Trigo, Comunicado Técnico Online 207, Table 3", url: "https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/852400/1/pco207.pdf" }
      limitations:
        - "Team analysis, not re-verified by the independent check: use it as an order of magnitude."
        - "CONAB costs are for a modal high-input farm; revenue is the municipal average, which tends to exaggerate the loss for an above-average field."
        - "The cover-crop cost is one 2007 data point updated by inflation, without desiccation; its agronomic benefits are not converted into money."
