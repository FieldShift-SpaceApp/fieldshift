# SI-assisted: Claude Code (Anthropic); review: pending (see SI-USAGE.md)
# CI: hygiene · science · web. Branch protection: these three jobs are required to merge into main (NFR11).
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene: # NFR9 / ADR-5: forbidden paths + secret scan over the full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: forbidden paths
        run: bash scripts/check-public-repo.sh
      - name: gitleaks (pinned image)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --exit-code 1

  science: # pipeline (no external network)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/science
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # same uv as the machines that write uv.lock; a newer uv may reject the lock
          version: "0.11.3"
      - name: install (exactly uv.lock; fails if it is out of date)
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: contracts schema drift (ADR-4)
        run: uv run fieldshift contracts export && git diff --exit-code -- ../../packages/contracts/schema

  web:
    runs-on: ubuntu-latest
    needs: [science]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: contracts types drift (ADR-4)
        run: npm run gen -w packages/contracts && git diff --exit-code -- packages/contracts/ts
      - run: npm run typecheck -w packages/contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test # Vitest
      - run: npm run build # prebuild: scripts/sync-data.mjs
      - name: install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e # Playwright: smoke (FR7 notice, zero external request)
